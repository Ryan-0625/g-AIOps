# gAIOps E2E Test Stack — overlay on docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml up --wait --wait-timeout 120
#   then: docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml run --rm e2e-runner

services:
  master:
    environment:
      CLUSTER_TOKEN: e2e-test-token
      AUDIT_ENABLED: "false"
      LOG_LEVEL: debug
      RATE_LIMIT_MAX: 1000

  worker:
    environment:
      CLUSTER_TOKEN: e2e-test-token
      LOG_LEVEL: debug
    ports:
      - "9090:9090"

  e2e-runner:
    build:
      context: .
      dockerfile: e2e/Dockerfile.e2e
    depends_on:
      master:
        condition: service_healthy
    environment:
      MASTER_API_URL: http://master:8080
      CLUSTER_TOKEN: e2e-test-token
    command: >
      e2e/ --e2e -v --tb=short
      --base-url http://master:8080
      --ws-url ws://master:8080/ws
      --cluster-token e2e-test-token
