# gAIOps Development Stack
# Usage: docker compose up -d
# Requires: config/master.yaml, config/worker.yaml, config/brain.yaml

services:
  master:
    build:
      context: ./master
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./config/master.yaml:/etc/gaiops/master.yaml:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/gaiops/certs:ro
    environment:
      - CLUSTER_TOKEN=${CLUSTER_TOKEN:-dev-token-change}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AUDIT_LOG_PATH=${AUDIT_LOG_PATH:-}
      - AUDIT_ENABLED=${AUDIT_ENABLED:-true}
      - TLS_CERT_PATH=${TLS_CERT_PATH:-}
      - TLS_KEY_PATH=${TLS_KEY_PATH:-}
    command: ["--config", "/etc/gaiops/master.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    depends_on:
      master:
        condition: service_healthy
    volumes:
      - ./config/worker.yaml:/etc/gaiops/worker.yaml:ro
      # Mount only specific paths the Worker needs, not the entire root filesystem.
      - /var/log:/var/log:ro
      - /var/run:/var/run:ro
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    command: ["--config", "/etc/gaiops/worker.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  brain:
    build:
      context: ./brain
      dockerfile: Dockerfile
    ports:
      - "9091:9091"
    depends_on:
      master:
        condition: service_healthy
    volumes:
      - ./config/brain.yaml:/app/brain.yaml:ro
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      # WARNING: OPENAI_API_KEY must be set via .env file or environment variable.
      # Never hardcode API keys in docker-compose files committed to version control.
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-deepseek-v4-flash}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-7b}
      - CLUSTER_TOKEN=${CLUSTER_TOKEN:-dev-token-change}
      - MASTER_API_URL=http://master:8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
