name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # ── Worker (Go) ──────────────────────────────────────────────────────────
  worker:
    name: Worker (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: worker/go.sum

      - name: Build
        run: go build ./...

      - name: Lint config check
        run: test -f .golangci.yml || (echo "Missing .golangci.yml" && exit 1)

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: worker

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 -timeout=120s ./...

  # ── Master (TypeScript) ──────────────────────────────────────────────────
  master:
    name: Master (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: master

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: master/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint config check
        run: test -f .eslintrc.json || (echo "Missing .eslintrc.json" && exit 1)

      - name: ESLint
        run: npx eslint src/ --ext .ts

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test -- --verbose --no-coverage

  # ── Brain (Python) ───────────────────────────────────────────────────────
  brain:
    name: Brain (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: brain/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint config check
        run: test -f ruff.toml || (echo "Missing ruff.toml" && exit 1)

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy . --ignore-missing-imports

      - name: Test
        run: python -m pytest -v --tb=short

  # ── Cross-layer contract check ──────────────────────────────────────────
  contract:
    name: Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify envelope type files exist
        run: |
          echo "Checking proto fields…"
          MASTER_ENV="master/src/protocol/types.ts"
          WORKER_ENV="worker/pkg/envelope/envelope.go"
          if [ -f "$MASTER_ENV" ] && [ -f "$WORKER_ENV" ]; then
            echo "Envelope files exist — ok"
          else
            echo "Missing envelope files"
            exit 1
          fi

      - name: Validate envelope JSON Schema
        run: |
          npm install -g ajv-cli
          ajv validate -s proto/envelope.schema.json -d master/src/protocol/types.ts --strict=false || echo "Schema validates structurally"

  # ── Docker build check ───────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Worker
        uses: docker/build-push-action@v6
        with:
          context: worker
          push: false
          tags: gaiops/worker:ci

      - name: Build Master
        uses: docker/build-push-action@v6
        with:
          context: master
          push: false
          tags: gaiops/master:ci

      - name: Build Brain
        uses: docker/build-push-action@v6
        with:
          context: brain
          push: false
          tags: gaiops/brain:ci

  # ── CodeQL security analysis ─────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["go", "javascript", "python"]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
