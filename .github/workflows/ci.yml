name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # ── Worker (Go) ──────────────────────────────────────────────────────────
  worker:
    name: Worker (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: worker/go.sum

      - name: Build
        run: go build ./...

      - name: Lint config check
        run: test -f .golangci.yml || (echo "Missing .golangci.yml" && exit 1)

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: worker

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 -timeout=120s ./...

  # ── Master (TypeScript) ──────────────────────────────────────────────────
  master:
    name: Master (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: master

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: master/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint config check
        run: test -f .eslintrc.json || (echo "Missing .eslintrc.json" && exit 1)

      - name: ESLint
        run: npx eslint src/ --ext .ts

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test -- --verbose --no-coverage

  # ── Brain (Python) ───────────────────────────────────────────────────────
  brain:
    name: Brain (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: brain/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint config check
        run: test -f ruff.toml || (echo "Missing ruff.toml" && exit 1)

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy . --ignore-missing-imports

      - name: Test
        run: python -m pytest -v --tb=short

  # ── Cross-layer contract check ──────────────────────────────────────────
  contract:
    name: Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify envelope type files exist
        run: |
          echo "Checking proto fields…"
          MASTER_ENV="master/src/protocol/types.ts"
          WORKER_ENV="worker/pkg/envelope/envelope.go"
          SCHEMA="proto/envelope.schema.json"
          for f in "$MASTER_ENV" "$WORKER_ENV" "$SCHEMA"; do
            if [ -f "$f" ]; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f — missing"
              exit 1
            fi
          done

      - name: Validate JSON test fixtures against schema
        run: |
          npm install -g ajv-cli ajv-formats
          FIXTURES="proto/test-fixtures"
          if [ ! -d "$FIXTURES" ]; then
            echo "No test-fixtures directory — skipping"
            exit 0
          fi
          PASS=0
          FAIL=0
          for f in "$FIXTURES"/valid-*.json; do
            if ajv validate -s proto/envelope.schema.json -d "$f" --strict=false 2>/dev/null; then
              echo "  ✓ $f"
              PASS=$((PASS + 1))
            else
              echo "  ✗ $f — validation failed"
              FAIL=$((FAIL + 1))
            fi
          done
          for f in "$FIXTURES"/invalid-*.json; do
            if ajv validate -s proto/envelope.schema.json -d "$f" --strict=false 2>/dev/null; then
              echo "  ✗ $f — expected to fail but passed"
              FAIL=$((FAIL + 1))
            else
              echo "  ✓ $f (expected failure)"
              PASS=$((PASS + 1))
            fi
          done
          echo "Schema validation: $PASS passed, $FAIL failed"
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Check enum consistency across layers
        run: |
          ERR=0
          # msg_type enum values
          SCHEMA_MT="request response event ack heartbeat"
          TS_MT="request response event ack heartbeat"
          GO_MT="request response event ack heartbeat"
          for v in $SCHEMA_MT; do
            echo "$TS_MT" | grep -q "\b$v\b" || { echo "✗ TypeScript missing msg_type: $v"; ERR=1; }
            echo "$GO_MT" | grep -q "\b$v\b" || { echo "✗ Go missing msg_type: $v"; ERR=1; }
          done

          # source/target role values (excluding broadcast which is target-only)
          SCHEMA_ROLE="brain master worker"
          TS_ROLE="brain master worker broadcast"
          GO_ROLE="brain master worker broadcast"
          # source must not include broadcast
          for v in $SCHEMA_ROLE; do
            echo "$TS_ROLE" | grep -q "\b$v\b" || { echo "✗ TypeScript missing role: $v"; ERR=1; }
            echo "$GO_ROLE" | grep -q "\b$v\b" || { echo "✗ Go missing role: $v"; ERR=1; }
          done

          # status enum values
          SCHEMA_ST="success failure pending cancelled"
          TS_ST="success failure pending cancelled"
          GO_ST="success failure pending cancelled"
          for v in $SCHEMA_ST; do
            echo "$TS_ST" | grep -q "\b$v\b" || { echo "✗ TypeScript missing status: $v"; ERR=1; }
            echo "$GO_ST" | grep -q "\b$v\b" || { echo "✗ Go missing status: $v"; ERR=1; }
          done

          if [ "$ERR" -eq 0 ]; then
            echo "All enum values consistent across 3 layers"
          else
            echo "Enum inconsistency detected — fix before merging"
            exit 1
          fi

  # ── Docker build check ───────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Worker
        uses: docker/build-push-action@v6
        with:
          context: worker
          push: false
          tags: gaiops/worker:ci

      - name: Build Master
        uses: docker/build-push-action@v6
        with:
          context: master
          push: false
          tags: gaiops/master:ci

      - name: Build Brain
        uses: docker/build-push-action@v6
        with:
          context: brain
          push: false
          tags: gaiops/brain:ci

  # ── CodeQL security analysis ─────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["go", "javascript", "python"]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
