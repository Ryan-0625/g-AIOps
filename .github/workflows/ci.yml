name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # ── Worker (Go) ──────────────────────────────────────────────────────────
  worker:
    name: Worker (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: worker/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 -timeout=120s ./...

  # ── Master (TypeScript) ──────────────────────────────────────────────────
  master:
    name: Master (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: master

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: master/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test -- --verbose --no-coverage

  # ── Brain (Python) ───────────────────────────────────────────────────────
  brain:
    name: Brain (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: brain/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (syntax check)
        run: python -m py_compile $(find . -name "*.py" -not -path "./__pycache__/*")

      - name: Test
        run: python -m pytest -v --tb=short

  # ── Cross-layer contract check ──────────────────────────────────────────
  contract:
    name: Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify envelope types are in sync
        run: |
          echo "Checking proto fields…"
          # Ensure master and worker share envelope structure
          MASTER_ENV="master/src/protocol/types.ts"
          WORKER_ENV="worker/pkg/envelope/envelope.go"
          if [ -f "$MASTER_ENV" ] && [ -f "$WORKER_ENV" ]; then
            echo "Envelope files exist — ok"
          else
            echo "Missing envelope files"
            exit 1
          fi
